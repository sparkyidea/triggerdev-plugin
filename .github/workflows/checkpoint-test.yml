name: Test checkpoint changes

on:
  pull_request:
    paths:
      - "services/checkpoint/**"
      - ".github/workflows/checkpoint-test.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.23.1
          cache: npm
          cache-dependency-path: services/checkpoint/package-lock.json
      - name: Validate service
        working-directory: services/checkpoint
        run: |
          npm ci
          npm test
          npm run check
      - name: Build review image
        run: docker build -t checkpoint-review services/checkpoint
      - name: Verify packaged HTTP service and health probe
        run: >-
          docker run --rm --network none -e CHECKPOINT_TEST_IMAGE=1
          --mount type=bind,source=${{ github.workspace }}/services/checkpoint/test,target=/app/test,readonly
          checkpoint-review node --test test/server.test.js
